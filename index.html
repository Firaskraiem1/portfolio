:root[data-theme=dark]{--bg:#080a12;--fg:#eceef6;--mu:#97a0b8;--card:rgba(20,24,38,.7);--ln:rgba(255,255,255,.09);--a:#8b8bff;--b:#22d3ee;--abg:rgba(139,139,255,.13);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 Inter,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vw;height:46vw;background:var(--a);top:-12vw;left:-8vw}
.bg i:nth-child(2){width:38vw;height:38vw;background:var(--b);bottom:-10vw;right:-6vw;animation-delay:-6s}
@keyframes fl{to{transform:translate(6vw,5vh) scale(1.15)}}
.pg{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--b));z-index:20}
.w{max-width:1040px;margin:0 auto;padding:0 22px}
header{position:fixed;top:12px;left:0;right:0;z-index:10}
header .w{display:flex;align-items:center;gap:14px;height:54px;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:16px;max-width:1000px;padding:0 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--a)}
@media(max-width:380px){.logo span{display:none}}
nav{margin-left:auto;display:flex;gap:4px}
nav a{padding:6px 12px;border-radius:10px;font-size:14px;color:var(--mu);transition:.2s}
nav a:hover,nav a.on{color:var(--fg);background:var(--abg)}
.ctl{display:flex;gap:6px}
.ctl button{border:1px solid var(--ln);background:transparent;color:var(--fg);border-radius:10px;padding:5px 10px;font:600 13px Inter;cursor:pointer;transition:.2s}
.ctl button[aria-pressed=true]{background:var(--a);border-color:var(--a);color:#fff}
@media(max-width:760px){nav{display:none}.ctl{margin-left:auto}}
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:110px 22px 60px}
@keyframes sp{to{transform:rotate(360deg)}}
.mq{overflow:hidden;border-block:1px solid var(--ln);padding:14px 0;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq div{display:flex;gap:34px;width:max-content;animation:mqa 38s linear infinite;font:500 14px 'JetBrains Mono',monospace;color:var(--mu)}
.mq span::before{content:"◆ ";color:var(--a)}
@keyframes mqa{to{transform:translateX(-50%)}}
.card{position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--abg),transparent 60%)}
.card:hover::after{opacity:1}
h2::after{content:"";display:block;width:56px;height:4px;border-radius:4px;margin-top:12px;background:linear-gradient(90deg,var(--a),var(--b))}
.ct h2::after{margin-inline:auto}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--ln);background:var(--card);padding:6px 14px;border-radius:999px;font-size:13px;color:var(--mu)}
.pill b{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 #22c55e88;animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 9px #22c55e00}}
h1{font-size:clamp(40px,8vw,84px);line-height:1.02;letter-spacing:-.04em;margin:18px 0 10px;font-weight:800}
.g{background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font:500 clamp(16px,2.4vw,22px) 'JetBrains Mono',monospace;color:var(--mu);min-height:1.6em}
.role::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--a);margin-left:4px;vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.lead{max-width:640px;color:var(--mu);font-size:18px;margin:18px 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{padding:11px 20px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-weight:600;font-size:15px;transition:.25s;backdrop-filter:blur(8px)}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 28px -10px var(--a)}
.btn.p{background:linear-gradient(100deg,var(--a),var(--b));border:0;color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:48px}
.st{padding:16px 18px;border:1px solid var(--ln);border-radius:16px;background:var(--card);backdrop-filter:blur(8px)}
.st strong{display:block;font-size:30px;letter-spacing:-.03em}.st span{font-size:13px;color:var(--mu)}
section{padding:80px 0}
.eyebrow{font:500 13px 'JetBrains Mono',monospace;color:var(--a);letter-spacing:.08em;text-transform:uppercase}
h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:6px 0 32px}
.about{max-width:780px;color:var(--mu);font-size:18px}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--a),var(--b),transparent)}
.it{position:relative;margin-bottom:22px}
.it::before{content:"";position:absolute;left:-28px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--a)}
.card{border:1px solid var(--ln);background:var(--card);backdrop-filter:blur(10px);border-radius:20px;padding:22px 24px;transition:.3s}
.card:hover{border-color:var(--a);transform:translateY(-4px);box-shadow:0 18px 40px -22px var(--a)}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.card h3{margin:0;font-size:20px;letter-spacing:-.02em}
.dt{font:500 13px 'JetBrains Mono',monospace;color:var(--mu)}
.rl{color:var(--a);font-weight:600;font-size:14px;margin:2px 0 10px}
.card ul{margin:8px 0 0;padding-left:18px;color:var(--mu);font-size:15px}.card li{margin:6px 0}.card li b{color:var(--fg);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{background:var(--abg);color:var(--a);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card.f{grid-column:1/-1;border-color:var(--a);background:linear-gradient(135deg,var(--abg),var(--card))}
.card .pd{color:var(--mu);font-size:15px;margin:8px 0 0}.card .pd+.pd{margin-top:6px}
.sk{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.sk h4{margin:0 0 6px;font-size:15px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.ct{text-align:center;padding:90px 0}
.ct .btns{justify-content:center}.ct p{color:var(--mu);max-width:520px;margin:0 auto 26px;font-size:18px}
footer{border-top:1px solid var(--ln);padding:26px 0;text-align:center;color:var(--mu);font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.ph{position:relative;justify-self:center;width:min(430px,100%)}
.ph::before{content:"";position:absolute;inset:-16px;border-radius:44px;border:1px solid var(--ln);transform:rotate(-3deg);transition:transform .6s}
.ph:hover::before{transform:rotate(0)}
.ph .fr{position:relative;border-radius:34px;overflow:hidden;aspect-ratio:15/16;border:1px solid var(--ln);box-shadow:0 40px 80px -34px var(--a);background:linear-gradient(160deg,var(--a),var(--b))}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 10%;transition:transform .8s}
.ph:hover img{transform:scale(1.04)}
.ph .tg{position:absolute;z-index:2;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px}
.ph .bd{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);color:#fff;font:500 12px 'JetBrains Mono',monospace}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:100px}.ph{order:-1;width:min(300px,82%)}}

button.btn{font:600 15px Inter,sans-serif;color:inherit;cursor:pointer}
.md{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.md[hidden]{display:none}
.mb{width:min(960px,100%);height:min(92vh,100%);background:var(--bg);border:1px solid var(--ln);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln)}
.mh span{display:flex;gap:8px;flex-wrap:wrap}.mh .btn{padding:7px 14px;font-size:14px}
.mb iframe{flex:1;border:0;width:100%;background:#fff}
